<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>나의 방어기제는 무엇일까?</title>

<!-- 카톡/SNS 공유 시 보이는 링크 미리보기 (결과와 무관하게 항상 고정) -->
<meta property="og:title" content="나의 방어기제는 무엇일까?" />
<meta property="og:description" content="나도 몰랐던 내 모습, 1분 안에 알아보기" />
<meta property="og:image" content="https://YOUR_DOMAIN/share-preview.png" />
<meta property="og:url" content="https://YOUR_DOMAIN" />

<link rel="stylesheet" href="style.css" />
</head>
<body>
<div class="app-frame">
  <div class="card-shell">

    <div class="screen active" id="screen-hook">
      <div class="scroll">
        <div class="entry-body">
          <span class="entry-badge">1분이면 충분해요</span>
          <div class="entry-icon">
            <svg viewBox="0 0 180 180" width="120" height="120">
              <circle cx="90" cy="92" r="72" fill="#F7F7F7"/>
              <path d="M90 34 L138 52 L138 82 Q138 122 90 148 Q42 122 42 82 L42 52 Z" fill="#FFD3D3"/>
              <path d="M90 34 L138 52 L138 82 Q138 122 90 148 Z" fill="#FF7A7A" opacity="0.55"/>
              <circle cx="74" cy="86" r="6.5" fill="#8A1F1F"/><circle cx="106" cy="86" r="6.5" fill="#8A1F1F"/>
              <path d="M70 108 Q90 122 110 108" fill="none" stroke="#8A1F1F" stroke-width="4" stroke-linecap="round"/>
            </svg>
          </div>
          <h1 class="entry-h1">나는 왜 자꾸<br>괜찮은 척할까?</h1>
          <p class="entry-body-text">
            힘든 일이 있어도 웃고,<br>
            속상해도 아무렇지 않은 척하고,<br>
            불편한 감정은 애써 외면할 때가 있죠.
          </p>
          <p class="entry-reframe">우리는 모두 불편한 감정으로부터<br>나를 지키는 각자의 방법이 있어요.</p>
        </div>
      </div>
      <div class="entry-footer">
        <button class="btn btn--primary" onclick="goScreen('screen-pretest')">내 방어기제 알아보기 →</button>
        <div class="entry-meta">약 1분 · 12문항</div>
      </div>
    </div>

    <div class="screen" id="screen-pretest">
      <div class="entry-body">
        <div class="entry-icon">
          <svg viewBox="0 0 180 180" width="104" height="104">
            <circle cx="90" cy="92" r="72" fill="#F7F7F7"/>
            <circle cx="90" cy="90" r="40" fill="#FFD3D3"/>
            <path d="M74 88 Q90 76 106 88" fill="none" stroke="#8A1F1F" stroke-width="4" stroke-linecap="round"/>
            <circle cx="78" cy="98" r="4.5" fill="#8A1F1F"/><circle cx="102" cy="98" r="4.5" fill="#8A1F1F"/>
          </svg>
        </div>
        <h1 class="entry-h1" style="font-size:21px;">당신의 마음은<br>어떻게 당신을 지키고 있을까요?</h1>
        <p class="entry-body-text">지금부터 몇 가지 상황을 보여드릴게요.<br>가장 나와 가까운 답을 골라주세요.</p>
        <p class="entry-reframe">정답은 없어요.<br>지금의 나를 가장 솔직하게 골라보세요.</p>
      </div>
      <div class="entry-footer">
        <button class="btn btn--primary" onclick="startQuiz()">시작하기 →</button>
      </div>
    </div>

    <div class="screen" id="screen-quiz">
      <div class="quiz-progress-row">
        <div class="quiz-progress-track"><div class="quiz-progress-fill" id="qbar" style="width:8.3%"></div></div>
        <span class="quiz-count" id="qcount">1 / 12</span>
      </div>
      <div class="scroll"><div class="quiz-body" id="qbody"></div></div>
      <div class="entry-footer">
        <button class="btn btn--ghost quiz-back" id="qprev" onclick="qPrev()">이전 문항</button>
      </div>
    </div>

    <div class="screen" id="screen-result" style="position:relative;">
      <div id="resultMount" style="display:flex;flex-direction:column;flex:1;overflow:hidden;"></div>
    </div>

  </div>
</div>

<script src="questions.js"></script>
<script src="results.js"></script>
<script src="app.js"></script>
</body>
</html>
